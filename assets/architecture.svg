<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="Isometric architecture diagram of the STREAMAI chat app">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a16"/>
      <stop offset="1" stop-color="#05050b"/>
    </linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="pu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="fu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#c026d3"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <g stroke="#22d3ee" stroke-opacity="0.08">
    <path d="M0 460 H1280 M0 500 H1280 M0 540 H1280" fill="none"/>
    <path d="M-60 560 L660 330 M220 560 L820 330 M500 560 L980 330 M780 560 L1140 330 M1060 560 L1300 330" fill="none"/>
  </g>

  <!-- helper: isometric box faces -->
  <!-- each box drawn as top + left + right -->
  <g stroke="#0f172a" stroke-width="1.2">

    <!-- Box 1: Browser (left, cyan) -->
    <g transform="translate(120 240)">
      <polygon points="0,0 150,-74 150,126 0,200" fill="#22d3ee" fill-opacity="0.85"/>
      <polygon points="0,0 150,-74 300,0 150,74" fill="#164e63" fill-opacity="0.9"/>
      <polygon points="0,200 150,126 300,200 150,74" fill="#0e7490" fill-opacity="0.9"/>
      <polygon points="0,0 0,200 150,126 150,-74" fill="#155e75" fill-opacity="0.95"/>
      <text x="150" y="66" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="22" font-weight="700" fill="#ffffff">BROWSER</text>
      <text x="150" y="94" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="14" font-weight="400" fill="#a5f3fc">React + Next.js UI</text>
      <text x="150" y="114" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="13" fill="#67e8f9">useChat() stream hook</text>
    </g>

    <!-- Box 2: Next.js Route Handler (center, purple) -->
    <g transform="translate(520 240)">
      <polygon points="0,0 150,-74 150,126 0,200" fill="#a855f7" fill-opacity="0.85"/>
      <polygon points="0,0 150,-74 300,0 150,74" fill="#4c1d95" fill-opacity="0.9"/>
      <polygon points="0,200 150,126 300,200 150,74" fill="#6d28d9" fill-opacity="0.9"/>
      <polygon points="0,0 0,200 150,126 150,-74" fill="#5b21b6" fill-opacity="0.95"/>
      <text x="150" y="52" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="20" font-weight="700" fill="#ffffff">NEXT.JS API</text>
      <text x="150" y="76" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="14" fill="#ddd6fe">/api/chat route</text>
      <text x="150" y="100" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="13" fill="#c4b5fd">server-side only</text>
      <text x="150" y="122" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="13" fill="#c4b5fd">env keys in process.env</text>
    </g>

    <!-- Box 3: Google Gemini (right top, fuchsia) -->
    <g transform="translate(910 150)">
      <polygon points="0,0 130,-64 130,106 0,170" fill="#e879f9" fill-opacity="0.85"/>
      <polygon points="0,0 130,-64 260,0 130,64" fill="#86198f" fill-opacity="0.9"/>
      <polygon points="0,170 130,106 260,170 130,64" fill="#a21caf" fill-opacity="0.9"/>
      <polygon points="0,0 0,170 130,106 130,-64" fill="#701a75" fill-opacity="0.95"/>
      <text x="130" y="66" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="18" font-weight="700" fill="#ffffff">GOOGLE GEMINI</text>
      <text x="130" y="92" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="12" fill="#fae8ff">gemini-3.5-flash</text>
    </g>

    <!-- Box 4: OpenRouter (right bottom, indigo) -->
    <g transform="translate(910 320)">
      <polygon points="0,0 130,-64 130,106 0,170" fill="#818cf8" fill-opacity="0.85"/>
      <polygon points="0,0 130,-64 260,0 130,64" fill="#312e81" fill-opacity="0.9"/>
      <polygon points="0,170 130,106 260,170 130,64" fill="#4338ca" fill-opacity="0.9"/>
      <polygon points="0,0 0,170 130,106 130,-64" fill="#3730a3" fill-opacity="0.95"/>
      <text x="130" y="60" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="18" font-weight="700" fill="#ffffff">OPENROUTER</text>
      <text x="130" y="84" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="12" fill="#e0e7ff">Nemotron free model</text>
    </g>

    <!-- browser -> api (request) -->
    <g stroke="#22d3ee" stroke-width="3" fill="none">
      <path d="M420 300 C460 300 480 296 520 300" marker-end="url(#arrC)"/>
    </g>
    <!-- api -> gemini -->
    <g stroke="#e879f9" stroke-width="3" fill="none">
      <path d="M820 250 C850 240 880 224 910 218" marker-end="url(#arrF)"/>
    </g>
    <!-- api -> openrouter -->
    <g stroke="#818cf8" stroke-width="3" fill="none">
      <path d="M820 330 C850 340 880 376 910 390" marker-end="url(#arrI)"/>
    </g>
    <!-- gemini -> api (stream) -->
    <g stroke="#34d399" stroke-width="3" stroke-dasharray="6 6" fill="none">
      <path d="M910 250 C880 256 850 270 820 288" marker-end="url(#arrG)"/>
    </g>
    <!-- api -> browser (stream) -->
    <g stroke="#34d399" stroke-width="3" stroke-dasharray="6 6" fill="none">
      <path d="M520 330 C480 334 460 330 420 330" marker-end="url(#arrG2)"/>
    </g>

    <!-- localStorage pill -->
    <rect x="150" y="410" width="360" height="34" rx="17" fill="#164e63" fill-opacity="0.35" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="330" y="432" text-anchor="middle" font-family="'Segoe UI', Arial" font-size="13" fill="#67e8f9">session + chat history persist in browser localStorage</text>
  </g>

  <defs>
    <marker id="arrC" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrF" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e879f9"/>
    </marker>
    <marker id="arrI" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#818cf8"/>
    </marker>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34d399"/>
    </marker>
    <marker id="arrG2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#34d399"/>
    </marker>
  </defs>

  <g font-family="'Segoe UI', Arial" font-size="14">
    <text x="340" y="276" text-anchor="middle" fill="#22d3ee" font-weight="600">POST /api/chat</text>
    <text x="760" y="252" text-anchor="middle" fill="#e879f9" font-weight="600">streamText()</text>
    <text x="760" y="388" text-anchor="middle" fill="#818cf8" font-weight="600">streamText()</text>
    <text x="760" y="296" text-anchor="middle" fill="#34d399" font-weight="600">token stream</text>
    <text x="420" y="358" text-anchor="middle" fill="#34d399" font-weight="600">token stream</text>
  </g>
</svg>
